<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zorra Royals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#08090C" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #08090C;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }
    .crown {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 1px solid rgba(212,175,55,0.3);
      box-shadow: 0 0 30px rgba(212,175,55,0.3);
      animation: pulse 2s infinite ease-in-out;
    }
    .crown svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #FFD700;
      stroke-width: 2;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #FFF2A8 0%, #FFD700 40%, #D4AF37 70%, #997B24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    p {
      color: #94A3B8;
      font-size: 13px;
      letter-spacing: 0.5px;
      margin-bottom: 28px;
    }
    .loader {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(212,175,55,0.2);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .offline-box {
      display: none;
      margin-top: 16px;
    }
    .retry-btn {
      background: linear-gradient(135deg, #FFD700, #D4AF37);
      color: #08090C;
      font-weight: 800;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(212,175,55,0.4);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(212,175,55,0.6); }
    }
  </style>
</head>
<body>
  <div class="crown">
    <svg viewBox="0 0 24 24">
      <path d="M2 19h20M3 15l4-8 5 4 5-4 4 8H3z" />
    </svg>
  </div>
  <h1>ZORRA ROYALS</h1>
  <p>Connecting to VIP Palace...</p>
  <div class="loader" id="loader"></div>
  <div class="offline-box" id="offlineBox">
    <p style="color: #EF4444; margin-bottom: 14px;">Connection timeout. Please check your internet connection.</p>
    <button class="retry-btn" onclick="retryConnection()">Connect Again</button>
  </div>

  <script>
    const TARGET_URL = "https://zoraaroyal.com";

    function launchApp() {
      if (navigator.onLine) {
        window.location.replace(TARGET_URL);
      } else {
        showOffline();
      }
    }

    function showOffline() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('offlineBox').style.display = 'block';
    }

    function retryConnection() {
      document.getElementById('offlineBox').style.display = 'none';
      document.getElementById('loader').style.display = 'block';
      setTimeout(launchApp, 500);
    }

    // Launch immediately
    window.addEventListener('load', () => {
      setTimeout(launchApp, 300);
    });
  </script>
</body>
</html>
